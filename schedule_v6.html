<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time schedules — Web Configurator (v5)</title>
<style>
/* ────────────────────────────────────────────────────────────────
   Design tokens (subset of the Axxon One "one-*" token set)
   ──────────────────────────────────────────────────────────────── */
:root,[data-scheme=light]{
  color-scheme:light;
  --fg-default:#4b4c53; --fg-muted:#7b7c85; --fg-subtle:#9a9aa2; --fg-disabled:#a0aec0;
  --bg-canvas:#f7f7f7; --bg-surface:#fff; --bg-muted:#f2f3f5; --bg-subtle:#e9ebf2; --bg-popup:#fff;
  --border-default:#d6dae3; --border-strong:#a0aec0; --border-popup:#d6d6d6;
  --control-bg:#e9ebf2; --control-hover:#f2f3f5; --control-selected:#e3e7ef;
  --accent:#0070e4; --accent-hover:#0189ff; --accent-pressed:#0053a8; --accent-on:#fff; --accent-soft:#d9ecff;
  --accent-half:#7fb5e8;
  --status-info:#0070e4; --status-warning:#ff8a00; --status-success:#20d300; --danger:#e01b24;
  --fb-info:#0070e41f; --fb-warning:#ff8a001f; --fb-success:#20d3001f; --fb-danger:#f0000f14;
  --grid-line:#e2e5ec; --grid-line-strong:#c9ced9; --track-bg:#fbfbfc;
  --scrim:#00000052; --shadow-popup:0 4px 12px #0000002e; --shadow-dialog:0 8px 28px #00000040;
}
[data-scheme=dark]{
  color-scheme:dark;
  --fg-default:#f6f6f6; --fg-muted:#b3b3b8; --fg-subtle:#858585; --fg-disabled:#858585;
  --bg-canvas:#121212; --bg-surface:#191919; --bg-muted:#1f1f1f; --bg-subtle:#2a2a2a; --bg-popup:#2a2a2a;
  --border-default:#333; --border-strong:#656565; --border-popup:#3d3d3d;
  --control-bg:#3d3d3d; --control-hover:#484848; --control-selected:#4a4a4a;
  --accent:#0070e4; --accent-hover:#0082f7; --accent-pressed:#0053a8; --accent-on:#fff; --accent-soft:#004184;
  --accent-half:#12558f;
  --status-info:#0070e4; --status-warning:#ff8a00; --status-success:#20d300; --danger:#ff5a5a;
  --fb-info:#0070e433; --fb-warning:#ff8a0033; --fb-success:#20d30033; --fb-danger:#ff000033;
  --grid-line:#2c2c2c; --grid-line-strong:#3d3d3d; --track-bg:#161616;
  --scrim:#0009; --shadow-popup:0 4px 12px #0000006b; --shadow-dialog:0 8px 28px #000000a6;
}
:root{
  --r-xs:2px; --r-ctl:4px; --r-box:6px; --r-win:8px; --r-pill:999px;
  --fs-cap:9px; --fs-body:11px; --fs-ctl:12px; --fs-h3:14px; --fs-h2:16px;
  --font:Inter,Roboto,"Segoe UI",system-ui,sans-serif;
  --mono:"Roboto Mono",Consolas,ui-monospace,monospace;
  --ruler-w:224px;      /* checkbox + day name + gutter */
  --side-w:32px;        /* right gutter (kebab) */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font);font-size:var(--fs-ctl);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
::selection{background:var(--accent-soft)}

/* ── generic controls ─────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 10px;
  border:1px solid transparent;border-radius:var(--r-ctl);background:var(--control-bg);color:var(--fg-default);
  font-size:var(--fs-ctl);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--control-hover)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn--primary{background:var(--accent);color:var(--accent-on)}
.btn--primary:hover{background:var(--accent-hover)}
.btn--outline{background:transparent;border-color:var(--border-strong)}
.btn--outline:hover{background:var(--control-hover)}
.btn--subtle{background:transparent}
.btn--subtle:hover{background:var(--control-hover)}
.btn--danger{background:transparent;border-color:var(--border-strong);color:var(--danger)}
.btn--danger:hover{background:var(--fb-danger)}
.btn--sm{height:24px;padding:0 8px;font-size:var(--fs-body)}
.btn--icon{width:26px;padding:0;flex:none}
.btn--on{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-ctl);overflow:hidden;height:28px}
.seg button{height:100%;padding:0 10px;border:0;background:transparent;color:var(--fg-muted);font-size:var(--fs-ctl);cursor:pointer}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button:hover{background:var(--control-hover)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-on)}
.inp{height:28px;padding:0 8px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);
  background:var(--bg-surface);color:var(--fg-default);font-size:var(--fs-ctl);font-family:inherit;width:100%}
.inp:focus{outline:none;border-color:var(--accent-hover);box-shadow:0 0 0 1px var(--accent-hover)}
.inp--time{width:88px;font-variant-numeric:tabular-nums}
.inp--sm{height:24px;font-size:var(--fs-body)}
select.inp{cursor:pointer}
.lbl{display:block;font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.04em;color:var(--fg-subtle);margin-bottom:3px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:var(--r-pill);
  background:var(--bg-subtle);font-size:var(--fs-body);font-weight:600;white-space:nowrap}
.pill--live{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.pill--idle{background:transparent;border:1px solid var(--border-default);color:var(--fg-muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px solid var(--border-default);
  border-radius:var(--r-ctl);background:var(--bg-surface);font-size:var(--fs-body);white-space:nowrap}
.tog{height:26px;padding:0 9px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);
  background:transparent;color:var(--fg-muted);font-size:var(--fs-body);cursor:pointer}
.tog[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.muted{color:var(--fg-muted)}
kbd{display:inline-block;min-width:16px;padding:0 4px;border:1px solid var(--border-strong);border-bottom-width:2px;
  border-radius:3px;background:var(--bg-muted);font:inherit;font-size:var(--fs-cap);line-height:15px;text-align:center}
.subtle{color:var(--fg-subtle)}
.hint{font-size:var(--fs-body);color:var(--fg-muted);line-height:1.5}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--border-default);border:0;margin:0}

/* ── shell ────────────────────────────────────────────────────── */
.appbar{display:flex;align-items:center;gap:16px;height:44px;padding:0 16px;background:var(--bg-surface);
  border-bottom:1px solid var(--border-default)}
.appbar .brand{font-size:var(--fs-h3);font-weight:700;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:44px;padding:0 12px;border:0;background:transparent;color:var(--fg-muted);
  font-size:var(--fs-ctl);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--fg-default)}
.tabs button[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.langsel{height:28px;padding:0 24px 0 8px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);
  background:var(--bg-surface) no-repeat right 7px center;color:var(--fg-default);font-family:inherit;
  font-size:var(--fs-ctl);cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 12px,calc(100% - 8px) 12px;background-size:4px 4px,4px 4px}
.langsel:focus{outline:none;border-color:var(--accent-hover);box-shadow:0 0 0 1px var(--accent-hover)}
.shell{display:flex;align-items:stretch;height:calc(100vh - 44px);overflow:hidden}
body[data-resizing]{cursor:col-resize}
body[data-resizing] *{user-select:none!important}

/* ── panel splitters ──────────────────────────────────────────── */
.splitter{flex:none;width:7px;position:relative;cursor:col-resize;background:transparent;z-index:9}
.splitter::before{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:var(--border-default);
  transition:background .12s,left .12s,width .12s}
/* always-visible grip so the handle is discoverable, accent on hover/drag */
.splitter::after{content:"";position:absolute;top:50%;left:2px;width:3px;height:28px;margin-top:-14px;
  border-radius:2px;background:var(--border-strong);opacity:.5;transition:opacity .12s,background .12s}
.splitter:hover::before,.splitter--drag::before,.splitter:focus-visible::before{left:2px;width:3px;background:var(--accent)}
.splitter:hover::after,.splitter--drag::after,.splitter:focus-visible::after{opacity:1;background:var(--accent)}
.splitter:focus-visible{outline:none}

/* ── left: schedule list ─────────────────────────────────────── */
.side{width:268px;flex:none;background:var(--bg-surface);
  display:flex;flex-direction:column;min-height:0}
.side__head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.side__title{font-size:var(--fs-h3);font-weight:600}
.side__list{flex:1;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:3px}
.sched{position:relative;padding:8px 26px 8px 10px;border:1px solid transparent;border-radius:var(--r-box);cursor:pointer}
.sched:hover{background:var(--control-hover)}
.sched[aria-selected=true]{background:var(--control-selected);border-color:var(--accent)}
.sched__name{font-size:var(--fs-ctl);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sched__strip{display:flex;flex-direction:column;gap:2px;margin:7px 0 6px}
.sched__strip i{height:3px;border-radius:1px;background-color:var(--bg-subtle)}
.sched__meta{font-size:var(--fs-body);color:var(--fg-muted)}
.sched__kebab{position:absolute;top:6px;right:4px;opacity:0}
.sched:hover .sched__kebab,.sched[aria-selected=true] .sched__kebab{opacity:1}

/* ── centre: editor ───────────────────────────────────────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
.editor{padding:14px 18px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-box)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;
  background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-box)}
.tbsep{width:1px;align-self:stretch;background:var(--border-default);margin:0 2px}

/* grid */
.grid{border:1px solid var(--border-default);border-radius:var(--r-box);overflow:hidden;background:var(--bg-surface);user-select:none}
.ruler{display:flex;background:var(--bg-muted);border-bottom:1px solid var(--border-default)}
.ruler__pad{width:var(--ruler-w);flex:none;display:flex;align-items:center;padding-left:10px;
  font-size:var(--fs-cap);letter-spacing:.05em;text-transform:uppercase;color:var(--fg-subtle)}
.ruler__cells{flex:1;display:flex;min-width:0}
.ruler__cells span{flex:1;text-align:center;font-size:var(--fs-cap);color:var(--fg-muted);
  padding:4px 0;border-left:1px solid var(--grid-line);font-variant-numeric:tabular-nums}
.ruler__end{width:var(--side-w);flex:none;border-left:1px solid var(--grid-line)}
.drow{display:flex;align-items:stretch;border-top:1px solid var(--border-default)}
.drow:first-of-type{border-top:0}
.drow--dim{opacity:.42}
.drow--today .dday{font-weight:700;color:var(--fg-default)}
.drow--focus .dchk{box-shadow:inset 3px 0 0 var(--accent)}
.drow--focus .dday,.drow--focus .dsum{color:var(--accent);background:var(--fb-info)}
.drow--focus .dchk{background:var(--fb-info)}
.dchk{width:30px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg-muted);
  border-right:1px solid var(--grid-line)}
.dday{width:126px;flex:none;display:flex;align-items:center;padding-left:10px;font-size:var(--fs-ctl);
  color:var(--fg-muted);background:var(--bg-muted);cursor:pointer}
.dsum{width:68px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  font-size:var(--fs-body);color:var(--fg-muted);background:var(--bg-muted);border-right:1px solid var(--grid-line);
  font-variant-numeric:tabular-nums}
.track{flex:1;min-width:0;height:38px;position:relative;background:var(--track-bg);cursor:crosshair;
  background-image:repeating-linear-gradient(to right,var(--grid-line) 0,var(--grid-line) 1px,transparent 1px,transparent calc(100%/24))}
.track--erase{cursor:cell}
.dmenu{width:var(--side-w);flex:none;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--grid-line)}
.blk{position:absolute;top:4px;bottom:4px;border-radius:var(--r-ctl);background:var(--accent);color:var(--accent-on);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);font-variant-numeric:tabular-nums;
  overflow:hidden;white-space:nowrap;cursor:grab;box-shadow:inset 0 0 0 1px #ffffff26}
.blk--sel{box-shadow:0 0 0 2px var(--bg-surface),0 0 0 4px var(--fg-default);z-index:6}
.blk--cyc{background:repeating-linear-gradient(115deg,var(--accent) 0 7px,var(--accent-pressed) 7px 12px)}
.blk--cont{background:repeating-linear-gradient(45deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 55%,transparent) 6px 12px);
  cursor:pointer;opacity:.85}
.blk__h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.blk__h--l{left:0} .blk__h--r{right:0}
.ghost{position:absolute;top:4px;bottom:4px;border-radius:var(--r-ctl);background:var(--accent-soft);
  border:1px dashed var(--accent);z-index:7;pointer-events:none;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-body);color:var(--accent);font-variant-numeric:tabular-nums}
.ghost--erase{background:var(--fb-danger);border-color:var(--danger);color:var(--danger)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--status-warning);z-index:8;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--status-warning)}

/* selection bar */
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;background:var(--bg-subtle);
  border-radius:var(--r-box);border:1px solid transparent}
.selbar--multi{border-color:var(--accent)}

/* tabs — v5 replacement for v4's five stacked accordions */
.tabbox{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-box);overflow:hidden}
.tabbar{display:flex;gap:2px;padding:0 6px;background:var(--bg-muted);border-bottom:1px solid var(--border-default);
  overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{height:33px;padding:0 11px;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--fg-muted);font-size:var(--fs-ctl);font-weight:500;cursor:pointer;white-space:nowrap}
.tabbar button:hover{color:var(--fg-default)}
.tabbar button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabbadge{display:inline-block;min-width:15px;margin-left:3px;padding:0 4px;border-radius:var(--r-pill);
  background:var(--bg-subtle);color:var(--fg-muted);font-size:var(--fs-cap);font-weight:600}
.tabbar button[aria-selected=true] .tabbadge{background:var(--accent);color:var(--accent-on)}
.tabbadge--warn,.tabbar button[aria-selected=true] .tabbadge--warn{background:var(--status-warning);color:#fff}
.tabbody{padding:12px}
.secttl{margin:0 0 3px;font-size:var(--fs-ctl);font-weight:600}
.notebox{padding:11px 13px;background:var(--bg-subtle);border-radius:var(--r-box);
  font-size:var(--fs-body);color:var(--fg-muted);line-height:1.5}
.grpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:10px}
.grp{border:1px solid var(--border-default);border-radius:var(--r-box);padding:9px 10px}
.grp h4{margin:0 0 6px;font-size:var(--fs-body);text-transform:uppercase;letter-spacing:.04em;color:var(--fg-subtle);font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
table.tbl th{text-align:left;font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.04em;
  color:var(--fg-subtle);font-weight:600;padding:4px 6px}
table.tbl td{padding:3px 6px;border-top:1px solid var(--grid-line);vertical-align:middle}
pre.json{margin:0;max-height:230px;overflow:auto;background:var(--bg-muted);border:1px solid var(--border-default);
  border-radius:var(--r-ctl);padding:10px;font-family:var(--mono);font-size:var(--fs-body);line-height:1.55}

/* ── right: day inspector ─────────────────────────────────────── */
.insp{width:306px;flex:none;background:var(--bg-surface);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.insp__scroll{flex:1;min-height:0;overflow:auto}
.insp__head{padding:13px 14px 10px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--border-default)}
.insp__title{font-size:var(--fs-h3);font-weight:600}
.insp__sec{padding:11px 14px;border-bottom:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px}
.ivrow{display:flex;align-items:center;gap:6px}
.ivrow__dur{width:62px;flex:none;text-align:right;font-size:var(--fs-body);color:var(--fg-muted);font-variant-numeric:tabular-nums}
.daychips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.daychk{display:flex;align-items:center;gap:6px;font-size:var(--fs-body);cursor:pointer}

/* ── status bar (bottom of the inspector) ─────────────────────── */
.statusbar{flex:none;padding:8px 14px 10px;background:var(--bg-muted);
  border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:6px}
/* Both notices share one font — only the colour tells them apart. */
.statusbar__msg{min-height:15px;font-size:var(--fs-body);font-weight:600;line-height:1.35;color:transparent}
.statusbar__msg[data-kind=warning]{color:var(--status-warning)}
.statusbar__msg[data-kind=success]{color:var(--status-success)}
.statusbar__msg[data-kind=info]{color:var(--status-info)}
.statusbar__msg[data-kind=danger]{color:var(--danger)}
.statusbar__clock{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--border-default);padding-top:7px}
.statusbar__day{flex:1;min-width:0;font-size:var(--fs-body);color:var(--fg-muted);line-height:1.35}
.statusbar__time{flex:none;font-size:var(--fs-h2);font-weight:600;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;color:var(--fg-default)}

/* ── overlays ─────────────────────────────────────────────────── */
.pop{position:fixed;z-index:60;background:var(--bg-popup);border:1px solid var(--border-popup);
  border-radius:var(--r-box);box-shadow:var(--shadow-popup);padding:6px;min-width:184px}
.pop__item{display:flex;align-items:center;gap:8px;width:100%;height:26px;padding:0 8px;border:0;background:transparent;
  color:var(--fg-default);font-size:var(--fs-ctl);text-align:left;cursor:pointer;border-radius:var(--r-ctl)}
.pop__item:hover{background:var(--control-hover)}
.pop__item--danger{color:var(--danger)}
.pop__cap{padding:5px 8px 3px;font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.04em;color:var(--fg-subtle)}
.pop__bar{width:46px;height:8px;border-radius:2px;flex:none;background-color:var(--bg-subtle)}
.scrim{position:fixed;inset:0;z-index:55}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:var(--scrim)}
.modal__box{width:392px;max-width:calc(100vw - 32px);background:var(--bg-popup);border-radius:var(--r-win);
  box-shadow:var(--shadow-dialog);overflow:hidden}
.modal__t{padding:14px 16px 0;font-size:var(--fs-h3);font-weight:600}
.modal__c{padding:8px 16px 16px;font-size:var(--fs-ctl);color:var(--fg-muted);line-height:1.55}
.modal__a{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── v4: pattern bar (week / cycle / crews) ───────────────────── */
.patbar{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px;padding:8px 10px;
  background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-box)}
.patfld{display:flex;flex-direction:column;gap:3px}
.patfld .lbl{margin:0}
.kindtag{display:inline-block;margin-left:5px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--accent-soft);color:var(--accent);font-size:var(--fs-cap);font-weight:600;vertical-align:1px}

/* two-line row header (label + next occurrence) */

/* ═══════════════════════════════════════════════════════════════
   Time schedules — prototype v6

   v6 = v5 plus two things, nothing else:

   1. SCROLL NO LONGER JUMPS TO THE TOP.
      paint() replaces shell.innerHTML wholesale, so every scroll container was
      a brand-new element with scrollTop 0. Any re-render — picking a schedule,
      clicking a calendar day, ticking a checkbox, saving — threw all three
      panels back to the top, and a 30-second timer did it with no user action
      at all. Now every scrollable region carries data-scroll, paint() records
      and restores their offsets, focus is restored with preventScroll, and the
      periodic tick updates only the time-dependent parts instead of rebuilding
      the page. See captureScroll / restoreScroll / tickLive.

   2. ONE PSIM visual family through bridge.css (see BRIDGE-README.md).
      No markup or behaviour was changed for the restyle; the only JS touched
      is the scroll fix above.

   What changed against v4 (see Comparision_with_other_SW.MD):

   SIMPLER
   • A schedule now has a TYPE, borrowed from Genetec's date coverage:
     24/7 · weekly · shift cycle · specific dates · astronomical.
     The editor shows only what the chosen type needs, so an ordinary
     "office hours" schedule is no more complex than Paxton Net2.
   • Holidays and exceptions collapsed into ONE mechanism: named
     "special day groups" (C•CURE's Holiday Group model). A schedule
     just picks groups and says what to do on them, top rule wins.
     Three overlapping concepts became one.
   • Five accordions became a calendar plus five tabs; the calendar
     collapses itself when a schedule has nothing to verify.
   • Dropped "same as another schedule" — no competitor has schedule
     composition, and it cost a recursion path and a whole selector.
   • Snap steps 15/30/60 (Paxton's split: mouse coarse, fields exact).
   • One coverage figure in the header instead of two.

   RICHER
   • Special days support ORDINAL rules — "second Sunday of May",
     "first Monday of every month" (Genetec Ordinal, C•CURE relative).
   • Plain-language explanation of why a date resolved the way it did
     (C•CURE's "How Schedules Behave").
   • Built-in read-only "Always" and "Never" — every product has them.
   • Astronomical schedules: sunset-to-sunrise with offsets, computed
     from coordinates (Genetec twilight, Milestone day length). Video
     subsystem only, as in Genetec.
   • Controller compatibility check: 3 intervals/day and 6 intervals
     per schedule are real market limits, and a 31-day cycle fits in
     neither. Now the editor says so before you save.
   • Time reference is explicit: server clock or the object's own.
   ═══════════════════════════════════════════════════════════════ */

function explainDate(s, dISO){

                   s.validTo && T('validTo') + ' ' + fmtDateMed(s.validTo)].filter(Boolean).join(', ');
    out.push(T('expOutside', { range }));

    out.push(T('expOvrRule', { n:eff.idx + 1, grp:groupName(eff.grp), mode:modeText(s, eff.src) }));
    const also = (s.overrides || []).map((o, i) => i > eff.idx && groupMatches(groupById(o.groupId), dISO) ? i + 1 : 0)
      .filter(Boolean);
    if(also.length) out.push(T('expAlsoMatched', { list:'№' + also.join(', №') }));
  } else {
    switch(kindOf(s)){
      case 'week':   out.push(T('expBaseWeek', { row:rowLabel(s, eff.row) })); break;

            b:fmt(a.mode === 'night' ? t.rise : t.set, S.use12), off:off ? off + ' ' + T('offMinutes') : '' }));

function compat(s, hwId){

      const old = patRows(s), p = blankPattern(kind, { len:Math.max(2, Math.min(old.length, MAX_CYCLE)),
        anchor:s.pattern.anchor });
      if(kind === 'week')  p.days = Array.from({ length:7 }, (_, i) => (old[i] || []).map(cl));
      if(kind === 'cycle') p.days = p.days.map((_, i) => (old[i] || []).map(cl));
      if(kind === 'dates'){ p.dates = []; p.days = []; }
      s.pattern = p;
      if(kind !== 'cycle'){ s.crewCount = 1; s.crewStep = 0; S.crewView = 0; }
      S.checked.clear(); S.focusRow = 0; S.sel = null;

function applyTemplate(tpl){
  const s = cur(), scoped = S.checked.size > 0 && tpl.kind === kindOf(s);
  const src = tplRows(tpl);
  const kindChange = tpl.kind !== kindOf(s) || (tpl.kind === 'cycle' && patLen(s) !== tpl.len);
  const msg = kindChange
    ? T('applyTplKind', { tpl:esc(tplLabel(tpl)), name:esc(schedName(s)), n:tpl.len || 7, kind:kindName(tpl.kind) })
    : (scoped ? T('applyTplScoped', { n:S.checked.size, tpl:esc(tplLabel(tpl)) })
              : T('applyTplWhole', { name:esc(schedName(s)), tpl:esc(tplLabel(tpl)) }));
  confirmThen(T('applyTplTitle'), msg, T('btnApply'), () => edit(() => {
    if(scoped && !kindChange){ S.checked.forEach(i => { if(src[i]) rows()[i] = src[i]; }); }
    else {
      s.pattern = tpl.kind === 'cycle'
        ? { kind:'cycle', anchor:s.pattern.anchor || todayISO(), days:src }
        : { kind:'week', days:src };
      if(tpl.kind === 'week'){ s.crewCount = 1; s.crewStep = 0; S.crewView = 0; }

function clearPattern(){
  const scoped = S.checked.size > 0;
  confirmThen(T('clearTitle'), scoped ? T('clearScoped', { n:S.checked.size }) : T('clearWhole'),
    T('btnClear'), () => edit(() => {
      if(scoped) S.checked.forEach(i => rows()[i] = []);
      else rows().forEach((_, i) => rows()[i] = []);
      S.sel = null;
    }));
}
function invertRows(){
  edit(() => {
    const targets = S.checked.size ? Array.from(S.checked) : rows().map((_, i) => i);
    targets.forEach(i => {
      const src = normalize((rows()[i] || []).filter(r => !r.cyc)).list;
      const out = []; let cursor = 0;
      src.forEach(r => { const st = Math.max(0, r.start);
        if(st > cursor) out.push(iv(cursor, st - cursor));
        cursor = Math.max(cursor, Math.min(DAY_MIN, r.start + r.len)); });
      if(cursor < DAY_MIN) out.push(iv(cursor, DAY_MIN - cursor));
      rows()[i] = out;
    });
    S.sel = null;
  });
}
function copyRowTo(from, targets, mode){
  edit(() => {
    const src = rows()[from] || [];
    targets.forEach(i => { if(i === from) return;
      setRow(i, mode === 'merge' ? (rows()[i] || []).concat(src.map(cl)) : src.map(cl)); });
  });
  notify('success', T('rowCopied', { row:rowLabel(cur(), from), n:targets.filter(i => i !== from).length }));
}
function setCycleLen(n){
  if(!(n >= 2 && n <= MAX_CYCLE)){ notify('warning', T('cycleLenWarn', { max:MAX_CYCLE })); return; }
  edit(() => {
    const s = cur(), old = patRows(s);
    s.pattern.days = Array.from({ length:n }, (_, i) => (old[i] || []).map(cl));
    s.crewStep = Math.min(s.crewStep, n - 1);
    S.focusRow = Math.min(S.focusRow, n - 1);
    S.checked = new Set(Array.from(S.checked).filter(i => i < n));
    S.sel = null;
  });
}
function addDate(dISO){
  const s = cur();
  if(s.pattern.dates.includes(dISO)){ notify('warning', T('dateExistsWarn')); return; }
  edit(() => {
    const pairs = s.pattern.dates.map((d, i) => ({ d, row:s.pattern.days[i] }));
    pairs.push({ d:dISO, row:[iv(540, 540)] });
    pairs.sort((a, b) => a.d.localeCompare(b.d));
    s.pattern.dates = pairs.map(p => p.d);
    s.pattern.days  = pairs.map(p => p.row);
    S.focusRow = s.pattern.dates.indexOf(dISO);
  });
}
function removeDate(i){
  edit(() => {
    const s = cur();
    s.pattern.dates.splice(i, 1); s.pattern.days.splice(i, 1);
    S.focusRow = Math.max(0, Math.min(S.focusRow, s.pattern.dates.length - 1));
    S.checked.clear(); S.sel = null;

const shell = document.getElementById('shell');

/* Every region that can scroll is marked with data-scroll. Because paint()
   throws the DOM away, the offsets have to be carried across by hand — this is
   what kept dragging the panels back to the top. */
function captureScroll(){
  const m = {};
  document.querySelectorAll('[data-scroll]').forEach(el => {
    if(el.scrollTop || el.scrollLeft) m[el.dataset.scroll] = [el.scrollTop, el.scrollLeft];
  });
  return m;
}
function restoreScroll(m){
  for(const key in m){
    const el = document.querySelector(`[data-scroll="${key}"]`);
    if(el){ el.scrollTop = m[key][0]; el.scrollLeft = m[key][1]; }
  }
}
function paint(){
  const el0 = document.activeElement;
  const fk = el0 && el0.getAttribute && el0.getAttribute('data-fk');
  const a = fk && el0.selectionStart, b = fk && el0.selectionEnd;
  const scroll = captureScroll();
  document.body.setAttribute('data-scheme', S.scheme);
  document.documentElement.setAttribute('lang', S.lang);
  document.title = T('sideTitle') + ' — ' + T('brand') + ' (v6)';
  document.getElementById('appbar').innerHTML = viewAppbar();
  shell.innerHTML = viewSide() + splitter('side') + viewMain() + splitter('insp') + viewInsp();
  document.getElementById('overlays').innerHTML = viewPop() + viewModal();
  if(fk){
    const el = document.querySelector(`[data-fk="${fk}"]`);
    /* preventScroll: focus() on its own scrolls the field into view, which is a
       jump of its own when the field was already visible before the re-render */
    if(el){ el.focus({ preventScroll:true }); try{ el.setSelectionRange(a, b); }catch(e){} }
  }
  restoreScroll(scroll);
}
function tickClock(){
  const c = clockParts();
  const d = shell.querySelector('[data-clk=day]'), t = shell.querySelector('[data-clk=time]');

  const s = cur(), tnow = nowMin(), today = todayISO();
  const todayRow = rowIndexFor(s, today);
  const body = patRows(s).map((list, i) => {

    const covered = coveredOnRow(s, i);

      .filter(r => r.start + r.len > DAY_MIN).map(r => blockHtml(cycPrev(s, i), r, true)).join('');
    const isToday = i === todayRow;

function blockHtml(owner, r, isCont){
  const s = cur();
  const from = isCont ? 0 : r.start;
  const to   = isCont ? r.start + r.len - DAY_MIN : Math.min(r.start + r.len, DAY_MIN);
  const w = (to - from) / DAY_MIN * 100, l = from / DAY_MIN * 100;
  const sel = !isCont && S.sel && S.sel.row === owner && S.sel.id === r.id;
  const full = `${fmt(r.start, S.use12)} – ${fmtEnd(r.start + r.len, S.use12)}` + (r.cyc ? T('cycTitle', r.cyc) : '');
  const mark = r.cyc ? ' ↻' : '';
  const text = w < 4.5 ? '' : (w < 11 ? fmt(r.start, S.use12) + mark
    : `${fmt(r.start, S.use12)} – ${fmtEnd(r.start + r.len, S.use12)}${r.cyc && w > 24 ? T('cycBlk', r.cyc) : mark}`);
  const cls = ['blk', r.cyc ? 'blk--cyc' : '', isCont ? 'blk--cont' : '', sel ? 'blk--sel' : ''].filter(Boolean).join(' ');
  return `<div class="${cls}" style="left:${l.toFixed(3)}%;width:${Math.max(w, .6).toFixed(3)}%"
      data-blk="${r.id}" data-owner="${owner}" data-cont="${isCont ? 1 : 0}"
      title="${esc(isCont ? full + T('continuesFrom', { row:rowLabel(s, owner) }) : full)}">
    ${isCont ? '' : '<span class="blk__h blk__h--l" data-h="l"></span>'}

}

function buildPayload(s){
  const kind = kindOf(s);
  const startOf = (r, i) => {
    const base = { hour:Math.floor(r.start / 60), minute:r.start % 60, second:0 };
    if(kind === 'week')  return Object.assign({ day_of_week:DAY_ISO[DAYS[i]] }, base);
    if(kind === 'cycle') return Object.assign({ day_of_cycle:i + 1 }, base);
    if(kind === 'dates') return Object.assign({ date:s.pattern.dates[i] }, base);
    return base;
  };
  const added = [];
  patRows(s).forEach((row, i) => row.forEach(r => added.push(Object.assign({
    start:startOf(r, i), length_seconds:r.len * 60,
    period_seconds:r.cyc ? r.cyc.every * 60 : (kind === 'cycle' ? patLen(s) : 7) * 86400
  }, r.cyc ? { pulse_seconds:r.cyc.on * 60 } : {}))));
  const used = {};
  (s.overrides || []).forEach(o => { const g = groupById(o.groupId); if(g) used[g.id] = g; });
  return {
    modify_intervals:[{
      id:s.id, name:schedName(s), builtin:!!s.builtin,
      pattern:Object.assign({ kind, length_days:kind === 'cycle' ? patLen(s) : (kind === 'week' ? 7 : null) },
        kind === 'cycle' ? { anchor_date:s.pattern.anchor } : {},
        kind === 'dates' ? { dates:s.pattern.dates.slice() } : {},
        kind === 'astro' ? { astronomical:{ window:s.pattern.astro.mode,

          end_offset_seconds:s.pattern.astro.offEnd * 60,
          latitude:s.pattern.astro.lat, longitude:s.pattern.astro.lon } } : {}),
      crews:kind === 'cycle' && s.crewCount > 1
        ? Array.from({ length:s.crewCount }, (_, k) => ({ index:k + 1, offset_days:k * s.crewStep })) : [],
      valid_from:s.validFrom || null, valid_to:s.validTo || null,
      time_reference:s.tz,
      added_intervals:added, modified_intervals:[], removed_intervals:[],
      overrides:(s.overrides || []).map((o, i) => ({
        priority:i + 1, day_group:o.groupId, mode:o.mode,
        same_as_day:o.mode === 'sameAs' ? o.sameAsRow + 1 : null,
        intervals:o.mode === 'custom' ? (o.iv || []).map(r => ({
          start:{ hour:Math.floor(r.start / 60), minute:r.start % 60, second:0 },
          length_seconds:r.len * 60 })) : []
      }))
    }],
    day_groups:Object.values(used).map(g => ({
      id:g.id, name:groupName(g), scope:g.scope,
      rules:(g.rules || []).map(r => r.kind === 'ordinal'
        ? { kind:'ordinal', nth:r.nth, day_of_week:DAY_ISO[r.dow], month:r.month === null || r.month === undefined ? null : r.month + 1 }
        : { kind:'date', from:r.from, to:r.to || r.from, yearly:!!r.yearly,

}

/* ══ EVENTS ═════════════════════════════════════════════════════ */
const snapv = v => Math.round(v / S.step) * S.step;
function popAt(el, kind, extra){
  const r = el.getBoundingClientRect();
  S.pop = Object.assign({ kind, x:Math.min(r.left, innerWidth - 330),
    y:Math.min(r.bottom + 4, innerHeight - 300) }, extra || {});
  render();
}
const ivById = (i, id) => (rows()[i] || []).find(r => r.id === id);
const ovrById = id => (cur().overrides || []).find(o => o.id === id);
const ruleById = (gid, rid) => { const g = groupById(gid); return g && (g.rules || []).find(r => r.id === rid); };
function selectSchedule(id){
  S.selectedId = id; S.sel = null; S.checked.clear(); S.focusRow = 0;
  S.cpTargets.clear(); S.crewView = 0; S.calSel = null; S.calForce = false; render();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, v = t.dataset.v, d = t.dataset.d, id = t.dataset.id;
  const i = t.dataset.i === undefined ? null : +t.dataset.i;
  const fr = () => S.focusRow;
  switch(a){
    case 'theme': S.scheme = S.scheme === 'light' ? 'dark' : 'light'; render(); return;
    case 'fmt': S.use12 = v === '12'; render(); return;

    case 'pick':
      if(S.dirty && id !== S.selectedId){
        confirmThen(T('switchTitle'), T('switchMsg'), T('btnSwitch'), () => selectSchedule(id));
        return;
      }
      selectSchedule(id); return;
    case 'addMenu': popAt(t, 'newKind'); return;
    case 'addPick': S.pop = null; addSchedule(v); return;
    case 'search': return;
    case 'schedMenu': popAt(t, 'sched', { id }); return;
    case 'smDup': S.pop = null; duplicateSchedule(id); return;
    case 'smDel': S.pop = null; deleteSchedule(id); return;
    case 'smExport': case 'export': S.pop = null; notify('info', T('exportToast')); render(); return;
    case 'import': notify('info', T('importToast')); return;

    case 'del': deleteSchedule(S.selectedId); return;
    case 'save': S.saved = snap(); S.dirty = false; cur().modified = '@now';
      notify('success', T('savedToast'), MSG_MS_SAVE); render(); return;
    case 'cancel': confirmThen(T('discardTitle'), T('discardMsg'), T('btnDiscard'), () => {
        restore(S.saved); S.undo.length = 0; S.redo.length = 0; notify('info', T('discardedToast')); render(); }); return;
    case 'goCompat': S.tab = 'compat'; render(); return;

    case 'kind': setKind(v); return;
    case 'crewsToggle': S.crewsOpen = !S.crewsOpen; render(); return;

    case 'tool': S.tool = v; render(); return;
    case 'step': S.step = +v; render(); return;
    case 'undo': doUndo(); return;
    case 'redo': doRedo(); return;
    case 'tplMenu': popAt(t, 'tpl'); return;
    case 'tplPick': S.pop = null; applyTemplate(TEMPLATES.find(x => x.id === v)); return;
    case 'invert': invertRows(); return;
    case 'clearAll': clearPattern(); return;

    case 'focusRow': S.focusRow = i; S.sel = null; render(); return;
    case 'rowMenu': popAt(t, 'row', { i }); return;
    case 'rmFill':  S.pop = null; edit(() => setRow(i, [iv(0, DAY_MIN)])); return;
    case 'rmClear': S.pop = null; edit(() => setRow(i, [])); return;
    case 'rmInv':   S.pop = null; S.checked = new Set([i]); invertRows(); S.checked.clear(); render(); return;
    case 'rmFocus': S.pop = null; S.focusRow = i; render(); return;
    case 'rmDate':  S.pop = null; removeDate(i); return;
    case 'closePop': S.pop = null; render(); return;

    case 'copyFrom': popAt(t, 'copyFrom'); return;
    case 'cfPick': S.pop = null; copyRowTo(i, Array.from(S.checked), 'replace'); return;
    case 'clearChecked': edit(() => S.checked.forEach(k => setRow(k, []))); return;
    case 'uncheckAll': S.checked.clear(); render(); return;

    case 'delIv': if(S.sel) edit(() => { setRow(S.sel.row, (rows()[S.sel.row] || []).filter(r => r.id !== S.sel.id)); S.sel = null; }); return;
    case 'copyIv': popAt(t, 'copyIv'); return;
    case 'ciPick': case 'ciAll': {
      const r = S.sel && ivById(S.sel.row, S.sel.id); if(!r){ S.pop = null; render(); return; }
      const targets = a === 'ciAll' ? patRows(cur()).map((_, k) => k).filter(k => k !== S.sel.row) : [i];
      S.pop = null;
      edit(() => targets.forEach(k => setRow(k, (rows()[k] || []).concat([cl(r)]))));
      notify('success', T('ivCopied', { n:targets.length })); return;
    }

    case 'calPrev': { const m = S.cal.m - 1; S.cal = m < 0 ? { y:S.cal.y - 1, m:11 } : { y:S.cal.y, m }; render(); return; }
    case 'calNext': { const m = S.cal.m + 1; S.cal = m > 11 ? { y:S.cal.y + 1, m:0 } : { y:S.cal.y, m }; render(); return; }
    case 'calToday': S.cal = { y:new Date().getFullYear(), m:new Date().getMonth() }; S.calSel = todayISO(); render(); return;
    case 'calPick': S.calSel = S.calSel === d ? null : d; render(); return;
    case 'calToggle': S.calOpen = !S.calOpen; render(); return;
    case 'calForce': S.calForce = true; render(); return;
    case 'calLocal': popAt(t, 'group', { d }); return;

    case 'qAll':   edit(() => setRow(fr(), [iv(0, DAY_MIN)])); return;
    case 'qBiz':   edit(() => setRow(fr(), [iv(540, 540)])); return;
    case 'qNight': edit(() => setRow(fr(), [iv(1320, 480)])); return;
    case 'qClear': edit(() => setRow(fr(), [])); return;
    case 'qInv':   S.checked = new Set([fr()]); invertRows(); S.checked.clear(); render(); return;
    case 'ivAdd':  edit(() => { const r = iv(540, 120);
      setRow(fr(), (rows()[fr()] || []).concat([r])); S.sel = { row:fr(), id:r.id }; }); return;
    case 'ivDel':  edit(() => setRow(fr(), (rows()[fr()] || []).filter(r => r.id !== id))); return;
    case 'ivCyc':  edit(() => { const r = ivById(fr(), id); if(r) r.cyc = r.cyc ? null : { every:30, on:5 }; }); return;

    case 'cpTgt': S.cpTargets.has(i) ? S.cpTargets.delete(i) : S.cpTargets.add(i); render(); return;
    case 'cpAll': S.cpTargets = new Set(patRows(cur()).map((_, k) => k).filter(k => k !== fr())); render(); return;
    case 'cpWorkdays': S.cpTargets = new Set([0,1,2,3,4].filter(k => k !== fr())); render(); return;
    case 'cpMerge': case 'cpReplace': {
      const tg = Array.from(S.cpTargets);
      if(!tg.length){ notify('warning', T('checkTargetWarn')); return; }
      copyRowTo(fr(), tg, a === 'cpMerge' ? 'merge' : 'replace'); S.cpTargets = new Set(); render(); return;
    }

    case 'tab': S.tab = t.dataset.k; render(); return;
    case 'libToggle': S.libOpen = !S.libOpen; render(); return;

    /* overrides */
    case 'ovrAdd': popAt(t, 'group'); return;
    case 'ovrPick': S.pop = null; addOverride(id); return;
    case 'ovrNew': { S.pop = null;
      const g = newGroup(true);
      if(d) editG(() => g.rules.push({ id:nid('r'), kind:'date', from:d, to:d, yearly:false }));
      addOverride(g.id); return; }
    case 'ovrUp':   moveOverride(id, -1); return;
    case 'ovrDown': moveOverride(id, +1); return;
    case 'ovrDel':  edit(() => cur().overrides = cur().overrides.filter(o => o.id !== id)); return;
    case 'ovrIvAdd': edit(() => { const o = ovrById(id); if(o) o.iv = normalize((o.iv || []).concat([iv(540, 240)])).list; }); return;
    case 'ovrIvDel': edit(() => { const o = ovrById(id); if(o) o.iv = (o.iv || []).filter(r => r.id !== t.dataset.iv); }); return;

    /* group library */
    case 'grpNew': newGroup(false); return;
    case 'grpDel': deleteGroup(id); return;
    case 'rAddDate': editG(() => groupById(t.dataset.g).rules.push({ id:nid('r'), kind:'date',
      from:S.calSel || todayISO(), to:S.calSel || todayISO(), yearly:true })); return;
    case 'rAddOrd':  editG(() => groupById(t.dataset.g).rules.push({ id:nid('r'), kind:'ordinal',
      nth:1, dow:'Mon', month:null })); return;
    case 'rDel': editG(() => { const g = groupById(t.dataset.g);
      g.rules = g.rules.filter(r => r.id !== id); }); return;
    case 'rDows': editG(() => {
      const r = ruleById(t.dataset.g, id), set = new Set(r.dows || []);
      set.has(v) ? set.delete(v) : set.add(v);
      r.dows = DAYS.filter(x => set.has(x));
    }); return;

    case 'tz': edit(() => cur().tz = v); return;

    case 'modalNo': S.modal = null; render(); return;
    case 'modalYes': { const f = S.modal && S.modal.fn; S.modal = null; render(); if(f) f(); return; }
  }
});

document.addEventListener('change', ev => {
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, id = t.dataset.id, fr = S.focusRow;
  const i = t.dataset.i === undefined ? null : +t.dataset.i;
  switch(a){
    case 'lang': S.lang = t.value; render(); return;
    case 'check': t.checked ? S.checked.add(i) : S.checked.delete(i); S.sel = null; render(); return;

    case 'cycLen': setCycleLen(+t.value); return;
    case 'cycAnchor': edit(() => cur().pattern.anchor = t.value || todayISO()); return;
    case 'crewCount': edit(() => { const s = cur(); s.crewCount = Math.max(1, Math.min(+t.value || 1, 8));
      if(s.crewCount > 1 && !s.crewStep) s.crewStep = Math.max(1, Math.floor(patLen(s) / s.crewCount));
      S.crewView = Math.min(S.crewView, s.crewCount - 1); }); return;
    case 'crewStep': edit(() => { const s = cur(); s.crewStep = Math.max(0, Math.min(+t.value || 0, patLen(s) - 1)); }); return;
    case 'crew': S.crewView = +t.value; render(); return;
    case 'dateAdd': if(t.value) addDate(t.value); return;

    case 'astMode': edit(() => cur().pattern.astro.mode = t.value); return;
    case 'astOffS': edit(() => cur().pattern.astro.offStart = Math.max(-120, Math.min(+t.value || 0, 120))); return;
    case 'astOffE': edit(() => cur().pattern.astro.offEnd = Math.max(-120, Math.min(+t.value || 0, 120))); return;
    case 'astLat':  edit(() => cur().pattern.astro.lat = Math.max(-89, Math.min(+t.value || 0, 89))); return;
    case 'astLon':  edit(() => cur().pattern.astro.lon = Math.max(-180, Math.min(+t.value || 0, 180))); return;
    case 'astTz':   edit(() => cur().pattern.astro.tzMin = +t.value); return;

    case 'ivFrom': case 'ivTo': edit(() => {
      const r = ivById(fr, id); if(!r) return;
      if(a === 'ivFrom'){ const end = r.start + r.len, st = Math.min(parseHM(t.value), DAY_MIN - S.step);
        r.start = st; r.len = Math.max(S.step, end - st); }
      else { let e = parseHM(t.value); if(e <= r.start) e += DAY_MIN; r.len = Math.max(S.step, e - r.start); }
      setRow(fr, rows()[fr]);
    }); return;
    case 'selFrom': case 'selTo': if(S.sel) edit(() => {
      const r = ivById(S.sel.row, S.sel.id); if(!r) return;
      if(a === 'selFrom'){ const end = r.start + r.len;
        r.start = Math.min(parseHM(t.value), DAY_MIN - S.step); r.len = Math.max(S.step, end - r.start); }
      else { let e = parseHM(t.value); if(e <= r.start) e += DAY_MIN; r.len = Math.max(S.step, e - r.start); }
      setRow(S.sel.row, rows()[S.sel.row]);
    }); return;
    case 'selCyc': edit(() => { const r = ivById(S.sel.row, S.sel.id); if(r) r.cyc = t.checked ? { every:30, on:5 } : null; }); return;
    case 'cycOn':    edit(() => { const r = ivById(S.sel.row, S.sel.id); if(r && r.cyc) r.cyc.on = Math.max(1, Math.min(+t.value || 1, r.cyc.every)); }); return;
    case 'cycEvery': edit(() => { const r = ivById(S.sel.row, S.sel.id); if(r && r.cyc){ r.cyc.every = Math.max(1, +t.value || 1); r.cyc.on = Math.min(r.cyc.on, r.cyc.every); } }); return;

    /* overrides */
    case 'ovrGrp':  edit(() => { ovrById(id).groupId = t.value; }); return;
    case 'ovrMode': edit(() => { const o = ovrById(id); o.mode = t.value;
      if(o.mode === 'custom' && !(o.iv || []).length) o.iv = [iv(540, 480)]; }); return;
    case 'ovrRow':  edit(() => { ovrById(id).sameAsRow = +t.value; }); return;
    case 'ovrIvFrom': case 'ovrIvTo': edit(() => {
      const o = ovrById(id); if(!o) return;
      const r = (o.iv || []).find(x => x.id === t.dataset.iv); if(!r) return;
      if(a === 'ovrIvFrom'){ const end = r.start + r.len, st = Math.min(parseHM(t.value), DAY_MIN - 15);
        r.start = st; r.len = Math.max(15, end - st); }
      else { let e = parseHM(t.value); if(e <= r.start) e += DAY_MIN; r.len = Math.max(15, e - r.start); }
      o.iv = normalize(o.iv).list;
    }); return;

    /* group rules */
    case 'rFrom': editG(() => { const r = ruleById(t.dataset.g, id);
      r.from = t.value; if(!r.to || r.to < r.from) r.to = r.from; }); return;
    case 'rTo':   editG(() => { const r = ruleById(t.dataset.g, id);
      r.to = t.value; if(r.from && r.to < r.from) r.from = r.to; }); return;
    case 'rYear': editG(() => { ruleById(t.dataset.g, id).yearly = t.checked; }); return;
    case 'rNth':  editG(() => { ruleById(t.dataset.g, id).nth = +t.value; }); return;
    case 'rDow':  editG(() => { ruleById(t.dataset.g, id).dow = t.value; }); return;
    case 'rMonth':editG(() => { ruleById(t.dataset.g, id).month = t.value === '' ? null : +t.value; }); return;

    case 'vFrom': edit(() => cur().validFrom = t.value); return;
    case 'vTo':   edit(() => cur().validTo = t.value); return;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act;
  if(a === 'search'){ S.search = t.value; render(); }
  else if(a === 'rename' && !ro()){ cur().name = t.value; cur().nameKey = null; S.dirty = snap() !== S.saved; render(); }
  else if(a === 'grpName'){ const g = groupById(t.dataset.id);
    if(g){ g.name = t.value; g.nameKey = null; S.dirty = snap() !== S.saved; } }
});

/* ── panel resizing ───────────────────────────────────────────── */
function clampPanel(which, w){
  const p = PANEL[which], other = which === 'side' ? S.inspW : S.sideW;
  return Math.round(Math.max(p.min, Math.min(w, p.max,
    Math.max(p.min, innerWidth - other - MAIN_MIN - 14))));
}
function setPanel(which, w){
  const v = clampPanel(which, w);
  if(which === 'side') S.sideW = v; else S.inspW = v;
  const el = shell.querySelector(which === 'side' ? '.side' : '.insp');
  if(el) el.style.width = v + 'px';
  const sp = shell.querySelector(`.splitter[data-split="${which}"]`);
  if(sp) sp.setAttribute('aria-valuenow', v);
  return v;
}
document.addEventListener('mousedown', ev => {
  const sp = ev.target.closest('.splitter'); if(!sp || ev.button !== 0) return;
  ev.preventDefault();
  S.rs = { which:sp.dataset.split, x0:ev.clientX, w0:sp.dataset.split === 'side' ? S.sideW : S.inspW };
  sp.classList.add('splitter--drag');
  document.body.dataset.resizing = '1';
});
document.addEventListener('mousemove', ev => {
  if(!S.rs) return;
  const dx = ev.clientX - S.rs.x0;
  setPanel(S.rs.which, S.rs.w0 + (S.rs.which === 'side' ? dx : -dx));
});
document.addEventListener('mouseup', () => {
  if(!S.rs) return;
  S.rs = null; delete document.body.dataset.resizing;
  shell.querySelectorAll('.splitter--drag').forEach(e => e.classList.remove('splitter--drag'));
  render();
});
document.addEventListener('dblclick', ev => {
  const sp = ev.target.closest('.splitter'); if(!sp) return;
  setPanel(sp.dataset.split, PANEL[sp.dataset.split].def); render();
});
addEventListener('resize', () => { setPanel('side', S.sideW); setPanel('insp', S.inspW); render(); });

/* ── grid drag ────────────────────────────────────────────────── */
document.addEventListener('mousedown', ev => {
  const track = ev.target.closest('.track'); if(!track || ev.button !== 0) return;
  if(ro()) return;
  const row = +track.dataset.track, rect = track.getBoundingClientRect();
  const toMin = x => Math.max(0, Math.min(DAY_MIN, (x - rect.left) / rect.width * DAY_MIN));
  const blk = ev.target.closest('.blk');
  if(blk && blk.dataset.cont === '1'){
    S.focusRow = +blk.dataset.owner; S.sel = { row:+blk.dataset.owner, id:blk.dataset.blk }; render(); return;
  }
  if(blk && S.tool === 'erase'){
    ev.preventDefault(); S.focusRow = row; S.sel = null;
    S.drag = { kind:'erase', row, rect, a:snapv(toMin(ev.clientX)), b:snapv(toMin(ev.clientX)), pushed:false };
    render(); return;
  }
  if(blk){
    const r = ivById(row, blk.dataset.blk); if(!r) return;
    ev.preventDefault();
    S.sel = { row, id:r.id }; S.focusRow = row; S.checked.clear();
    const handle = ev.target.closest('.blk__h');
    S.drag = { kind:handle ? (handle.dataset.h === 'l' ? 'left' : 'right') : 'move',
      row, id:r.id, rect, x0:ev.clientX, s0:r.start, l0:r.len, pushed:false };
    render(); return;
  }
  ev.preventDefault(); S.focusRow = row; S.sel = null;
  S.drag = { kind:S.tool === 'erase' ? 'erase' : 'paint', row, rect,
    a:snapv(toMin(ev.clientX)), b:snapv(toMin(ev.clientX)), pushed:false };
  render();
});
document.addEventListener('mousemove', ev => {
  const g = S.drag; if(!g) return;
  const toMin = x => Math.max(0, Math.min(DAY_MIN, (x - g.rect.left) / g.rect.width * DAY_MIN));
  if(g.kind === 'paint' || g.kind === 'erase'){ g.b = snapv(toMin(ev.clientX)); drawGhost(g); return; }
  const dm = snapv((ev.clientX - g.x0) / g.rect.width * DAY_MIN);
  if(!dm && !g.pushed) return;
  const r = ivById(g.row, g.id); if(!r) return;
  if(!g.pushed){ g.pushed = true; pushUndo(); }
  if(g.kind === 'move')      { r.start = Math.max(0, Math.min(g.s0 + dm, DAY_MIN - S.step)); r.len = g.l0; }
  else if(g.kind === 'left') { const end = g.s0 + g.l0; r.start = Math.max(0, Math.min(g.s0 + dm, end - S.step)); r.len = end - r.start; }
  else                       { r.len = Math.max(S.step, Math.min(g.l0 + dm, DAY_MIN * 2 - r.start)); }
  render();
});
document.addEventListener('mouseup', () => {
  const g = S.drag; if(!g) return; S.drag = null; clearGhost();
  if(g.kind === 'paint'){
    const from = Math.min(g.a, g.b), to = Math.max(g.a, g.b), len = to - from || 120;
    pushUndo();
    const r = iv(Math.min(from, DAY_MIN - S.step), Math.max(S.step, Math.min(len, DAY_MIN - from)));
    setRow(g.row, (rows()[g.row] || []).concat([r]));
    const kept = (rows()[g.row] || []).find(x => x.id === r.id)
      || (rows()[g.row] || []).find(x => x.start <= r.start && x.start + x.len >= r.start + r.len);
    S.sel = kept ? { row:g.row, id:kept.id } : null;
    S.dirty = snap() !== S.saved; render(); return;
  }
  if(g.kind === 'erase'){
    const from = Math.min(g.a, g.b), to = Math.max(g.a, g.b);
    pushUndo(); rows()[g.row] = subtract(rows()[g.row] || [], from, to === from ? to + S.step : to);
    S.dirty = snap() !== S.saved; render(); return;
  }
  if(!g.pushed){ render(); return; }
  setRow(g.row, rows()[g.row]);
  if(!ivById(g.row, g.id)) S.sel = (rows()[g.row] || []).length ? { row:g.row, id:rows()[g.row][0].id } : null;
  S.dirty = snap() !== S.saved; render();
});
function drawGhost(g){
  const track = shell.querySelector(`.track[data-track="${g.row}"]`); if(!track) return;
  let el = track.querySelector('.ghost');
  if(!el){ el = document.createElement('div'); el.className = 'ghost' + (g.kind === 'erase' ? ' ghost--erase' : ''); track.appendChild(el); }
  const from = Math.min(g.a, g.b), to = Math.max(g.a, g.b);
  el.style.left = (from / DAY_MIN * 100) + '%';
  el.style.width = (Math.max(to - from, 4) / DAY_MIN * 100) + '%';
  el.textContent = to - from >= 90 ? `${fmt(from, S.use12)} – ${fmt(to, S.use12)}` : '';
}
const clearGhost = () => shell.querySelectorAll('.ghost').forEach(e => e.remove());

document.addEventListener('dblclick', ev => {
  const blk = ev.target.closest('.blk'); if(!blk) return;
  S.focusRow = +blk.dataset.owner; S.sel = { row:+blk.dataset.owner, id:blk.dataset.blk }; render();
});

document.addEventListener('keydown', ev => {
  const sp = ev.target.classList && ev.target.classList.contains('splitter') ? ev.target : null;
  if(sp && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')){
    ev.preventDefault();
    const k = (ev.key === 'ArrowLeft' ? -1 : 1) * (ev.shiftKey ? 48 : 16), which = sp.dataset.split;
    setPanel(which, (which === 'side' ? S.sideW : S.inspW) + (which === 'side' ? k : -k));
    return;
  }
  if(sp && (ev.key === 'Home' || ev.key === 'Enter')){
    ev.preventDefault(); setPanel(sp.dataset.split, PANEL[sp.dataset.split].def); render(); return;
  }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName);
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){ ev.preventDefault(); ev.shiftKey ? doRedo() : doUndo(); return; }
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y'){ ev.preventDefault(); doRedo(); return; }
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault();
    if(S.dirty){ S.saved = snap(); S.dirty = false; notify('success', T('savedShort'), MSG_MS_SAVE); render(); } return; }
  if(ev.key === 'Escape'){
    if(S.modal){ S.modal = null; render(); } else if(S.pop){ S.pop = null; render(); }
    else if(S.calSel){ S.calSel = null; render(); } else if(S.sel){ S.sel = null; render(); } return;
  }
  if(typing || !S.sel) return;
  if(!ivById(S.sel.row, S.sel.id)) return;
  if(ev.key === 'Delete' || ev.key === 'Backspace'){
    ev.preventDefault();
    edit(() => { setRow(S.sel.row, (rows()[S.sel.row] || []).filter(x => x.id !== S.sel.id)); S.sel = null; }); return;
  }
  if(ev.key === 'ArrowLeft' || ev.key === 'ArrowRight'){
    ev.preventDefault();
    const k = ev.key === 'ArrowLeft' ? -S.step : S.step;
    edit(() => { const x = ivById(S.sel.row, S.sel.id); if(!x) return;
      if(ev.shiftKey) x.len = Math.max(S.step, x.len + k);
      else x.start = Math.max(0, Math.min(x.start + k, DAY_MIN - S.step)); });
  }
});

/* v5 ran a full render() every 30 s so the now-line and the "active now" marks
   would follow the clock. That rebuilt the whole page with no user action —
   the spontaneous jump to the top. Only the time-dependent parts are refreshed
   here; a full render happens only when the calendar date actually rolls over,
   and even then the scroll offsets survive it. */
let tickDay = todayISO();
function tickLive(){
  if(S.drag || S.rs) return;
  if(todayISO() !== tickDay){ tickDay = todayISO(); render(); return; }
  const t = nowMin(), left = (t / DAY_MIN * 100).toFixed(3) + '%', title = T('nowTitle', { t:fmt(t, S.use12) });
  shell.querySelectorAll('.nowline').forEach(el => { el.style.left = left; el.title = title; });
  shell.querySelectorAll('[data-live]').forEach(el => {
    const s = S.items[el.dataset.live];
    if(s) el.hidden = !isActiveNow(s);
  });
  const pill = shell.querySelector('[data-live-pill]');
  if(pill){
    const live = isActiveNow(cur());
    pill.className = 'pill ' + (live ? 'pill--live' : 'pill--idle');
    pill.textContent = live ? T('activeNow') : T('inactiveNow');
  }
}
setInterval(tickLive, 30000);
setInterval(tickClock, 1000);

render();
</script>
</body>
</html>
